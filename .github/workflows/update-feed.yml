name: Update RSS feed

on:
  schedule:
    # Запуск каждый час (в 5 минут каждого часа)
    - cron: '5 * * * *'
  workflow_dispatch:  # Возможность запустить вручную кнопкой

# Разрешения для публикации на GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSS feed
        run: python feed_generator.py

      - name: Commit and push news.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          git push
